name: Build Neonforge ISOs
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    name: build-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - name: Prepare container
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            live-build debootstrap squashfs-tools xorriso grub-common \
            mtools dosfstools gdisk parted zip unzip xz-utils curl wget \
            imagemagick file rsync

      - name: amd64 bootloader dependencies
        if: matrix.arch == 'amd64'
        run: |
          apt-get install -y --no-install-recommends \
            isolinux syslinux-common syslinux-efi grub-pc-bin grub-efi-amd64-bin

      - name: arm64 bootloader dependencies
        if: matrix.arch == 'arm64'
        run: |
          apt-get install -y --no-install-recommends grub-efi-arm64-bin

      - name: Assemble live-build tree
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -e
          rm -rf work
          mkdir -p work/config
          cp -a config-common/. work/config/
          cp -a config-${ARCH}/. work/config/
          find work/config/hooks -name '*.chroot' -exec chmod +x {} \;
          find work/config/includes.chroot -name '*.desktop' -exec chmod +x {} \;
          find work/config/includes.chroot -name 'neonforge-welcome' -exec chmod +x {} \;
          echo "--- tree check ---"
          ls -R work/config | head -n 80

      - name: Normalise line endings
        run: |
          set -e
          find work -type f -exec sed -i 's/\r$//' {} +
          find work/config/hooks -name '*.chroot' -exec chmod +x {} \;
          find work/config/includes.chroot -name '*.desktop' -exec chmod +x {} \;

      - name: lb config
        working-directory: work
        env:
          NF_ARCH: ${{ matrix.arch }}
        run: |
          set -e
          lb --version
          if [ "$NF_ARCH" = "amd64" ]; then
            BOOTLOADERS="syslinux,grub-efi"
          else
            BOOTLOADERS="grub-efi"
          fi
          lb config noauto \
            --mode debian \
            --distribution trixie \
            --architectures "$NF_ARCH" \
            --binary-images iso-hybrid \
            --bootloaders "$BOOTLOADERS" \
            --archive-areas "main contrib non-free non-free-firmware" \
            --mirror-bootstrap "http://deb.debian.org/debian/" \
            --mirror-chroot "http://deb.debian.org/debian
